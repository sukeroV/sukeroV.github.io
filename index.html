<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>config.yaml</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            background-color: #f5f5f5;
        }
        .nav-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: linear-gradient(135deg, #ff6b9d 0%, #d63384 100%);
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(214, 51, 132, 0.3);
            transition: all 0.3s ease;
            z-index: 1000;
        }
        .nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(214, 51, 132, 0.4);
        }
        pre {
            margin: 0;
            padding: 20px;
            padding-top: 60px;
            white-space: pre-wrap;
            word-wrap: break-word;
            background-color: white;
            min-height: 100vh;
        }
    </style>
</head>
<body>
    <button class="nav-btn" onclick="location.href='rank.html'">📊 查看排行榜</button>
    <pre id="yaml-content">加载中...</pre>
    <script>
        // 加载 config.yaml 文件
        fetch('cl_config.yaml', {
            headers: {
                'Accept': '*/*',
                'Accept-Charset': 'utf-8'
            }
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error('网络响应错误');
                }
                return response.text();
            })
            .then(data => {
                document.getElementById('yaml-content').textContent = data;
            })
            .catch(error => {
                document.getElementById('yaml-content').textContent = '加载失败: ' + error.message;
            });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B站UP主排行榜</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #fff5f7 0%, #ffe4ec 50%, #ffd6e0 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      color: #d63384;
      font-size: 2rem;
      text-shadow: 2px 2px 4px rgba(214, 51, 132, 0.2);
      margin-bottom: 10px;
    }

    .toolbar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filter-select {
      padding: 10px 15px;
      border: none;
      border-radius: 20px;
      background: white;
      color: #d63384;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(214, 51, 132, 0.2);
      outline: none;
    }

    .filter-checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #d63384;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .filter-checkbox input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #d63384;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 20px;
      background: white;
      color: #d63384;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(214, 51, 132, 0.2);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(214, 51, 132, 0.3);
    }

    .btn.active {
      background: linear-gradient(135deg, #ff6b9d 0%, #d63384 100%);
      color: white;
    }

    .rank-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    @media (max-width: 768px) {
      .rank-grid {
        grid-template-columns: 1fr;
      }
    }

    .rank-item {
      display: flex;
      align-items: center;
      padding: 15px 20px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
    }

    .rank-item:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
    }

    .rank-item.top1 {
      background: linear-gradient(135deg, #fff9e6 0%, #fff 100%);
      border: 2px solid #ffd700;
    }

    .rank-item.top2 {
      background: linear-gradient(135deg, #f5f5f5 0%, #fff 100%);
      border: 2px solid #c0c0c0;
    }

    .rank-item.top3 {
      background: linear-gradient(135deg, #ffe8e0 0%, #fff 100%);
      border: 2px solid #cd7f32;
    }

    .rank-number {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 50%;
      margin-right: 15px;
      flex-shrink: 0;
    }

    .rank-item.top1 .rank-number {
      background: linear-gradient(135deg, #ffd700 0%, #ffaa00 100%);
      color: white;
    }

    .rank-item.top2 .rank-number {
      background: linear-gradient(135deg, #c0c0c0 0%, #a0a0a0 100%);
      color: white;
    }

    .rank-item.top3 .rank-number {
      background: linear-gradient(135deg, #cd7f32 0%, #a0622e 100%);
      color: white;
    }

    .rank-item:not(.top1):not(.top2):not(.top3) .rank-number {
      background: #f0f0f0;
      color: #666;
    }

    .rank-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      margin-right: 15px;
      object-fit: cover;
      border: 2px solid #f0f0f0;
      flex-shrink: 0;
    }

    .rank-item.top1 .rank-avatar {
      border-color: #ffd700;
    }

    .rank-item.top2 .rank-avatar {
      border-color: #c0c0c0;
    }

    .rank-item.top3 .rank-avatar {
      border-color: #cd7f32;
    }

    .rank-info {
      flex: 1;
      min-width: 0;
    }

    .rank-name {
      font-size: 1rem;
      font-weight: 600;
      color: #333;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rank-meta {
      display: flex;
      gap: 10px;
      color: #888;
      font-size: 0.8rem;
      flex-wrap: wrap;
    }

    .rank-score {
      text-align: right;
      flex-shrink: 0;
    }

    .score-value {
      font-size: 1.2rem;
      font-weight: bold;
      color: #d63384;
    }

    .score-label {
      font-size: 0.75rem;
      color: #999;
    }

    .loading, .error, .empty {
      text-align: center;
      padding: 50px;
      color: white;
      font-size: 1.1rem;
      grid-column: 1 / -1;
    }

    .loading::after {
      content: "";
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #d63384;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 1s linear infinite;
      margin-left: 10px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .scroll-btn {
      position: fixed;
      right: 20px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: white;
      border: none;
      box-shadow: 0 4px 15px rgba(214, 51, 132, 0.3);
      cursor: pointer;
      font-size: 1.5rem;
      color: #d63384;
      transition: all 0.3s ease;
      z-index: 1000;
    }

    .scroll-btn:hover {
      transform: scale(1.1);
      background: linear-gradient(135deg, #ff6b9d 0%, #d63384 100%);
      color: white;
    }

    .scroll-top {
      bottom: 80px;
    }

    .scroll-bottom {
      bottom: 20px;
    }

    .update-time {
      text-align: center;
      margin-top: 20px;
      color: rgba(214, 51, 132, 0.7);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>B站UP主排行榜</h1>
    </div>

    <div class="toolbar">
      <select class="filter-select" id="categoryFilter" onchange="applyFilter()">
        <option value="">主营类目</option>
      </select>
      <label class="filter-checkbox">
        <input type="checkbox" id="newUpFilter" onchange="applyFilter()">
        只看新上榜UP主
      </label>
      <button class="btn active" onclick="sortBy('default', this)">当前榜单</button>
      <button class="btn" onclick="sortBy('fans', this)">按粉丝数 <span id="fansOrder">↓</span></button>
      <button class="btn" onclick="sortBy('rankTime', this)">按上榜次数 <span id="rankTimeOrder">↓</span></button>
      <button class="btn" onclick="exportToExcel()">📥 导出Excel</button>
    </div>

    <div class="rank-grid" id="rankList">
      <div class="loading">加载中</div>
    </div>

    <div class="update-time" id="updateTime"></div>
  </div>

  <button class="scroll-btn scroll-top" onclick="scrollToTop()" title="回到顶部">↑</button>
  <button class="scroll-btn scroll-bottom" onclick="scrollToBottom()" title="回到底部">↓</button>

  <script>
    let rankData = [];
    let originalData = [];
    let sortState = { fans: 'desc', rankTime: 'desc' };

    function parseFans(fansStr) {
      if (!fansStr) return 0;
      const str = fansStr.toString().replace(/,/g, '');
      if (str.includes('万')) {
        return parseFloat(str) * 10000;
      }
      return parseFloat(str) || 0;
    }

    async function loadRankList() {
      const rankList = document.getElementById("rankList");
      rankList.innerHTML = '<div class="loading">加载中</div>';

      try {
        const response = await fetch("https://cm.bilibili.com/cmc/api/open/rank/up/list?rank_type=0", {
          headers: {
            "accept": "application/json, text/plain, */*",
            "accept-language": "zh-CN,zh;q=0.9",
            "referer": "https://cm.bilibili.com/quests/",
            "sec-ch-ua": '"Chromium";v="146", "Not-A.Brand";v="24", "Google Chrome";v="146"',
            "sec-ch-ua-mobile": "?0",
            "sec-ch-ua-platform": '"Windows"',
            "sec-fetch-dest": "empty",
            "sec-fetch-mode": "cors",
            "sec-fetch-site": "same-origin",
            "user-agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/146.0.0.0 Safari/537.36",
          }
        });

        const data = await response.json();
        
        if (data && data.data) {
          originalData = Array.isArray(data.data) ? [...data.data] : [...(data.data.list || [])];
          rankData = [...originalData];
          initCategoryFilter();
        }
        
        applyFilter();
        document.getElementById("updateTime").textContent = `最后更新: ${new Date().toLocaleString("zh-CN")}`;
      } catch (error) {
        rankList.innerHTML = '<div class="error">加载失败，请稍后重试</div>';
        console.error("Error:", error);
      }
    }

    function sortBy(type, btn) {
      if (type === 'default') {
        document.querySelectorAll('.toolbar .btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        rankData = [...originalData];
        renderRankList();
        return;
      }

      document.querySelectorAll('.toolbar .btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      sortState[type] = sortState[type] === 'desc' ? 'asc' : 'desc';
      const order = sortState[type];
      
      document.getElementById(type + 'Order').textContent = order === 'desc' ? '↓' : '↑';

      if (type === 'fans') {
        rankData.sort((a, b) => {
          const aVal = parseFans(a.fans);
          const bVal = parseFans(b.fans);
          return order === 'desc' ? bVal - aVal : aVal - bVal;
        });
      } else if (type === 'rankTime') {
        rankData.sort((a, b) => {
          const aVal = a.rankTime || 0;
          const bVal = b.rankTime || 0;
          return order === 'desc' ? bVal - aVal : aVal - bVal;
        });
      }
      
      renderRankList();
    }

    function initCategoryFilter() {
      const categories = [...new Set(originalData.map(item => item.category).filter(Boolean))];
      const select = document.getElementById('categoryFilter');
      select.innerHTML = '<option value="">主营类目</option>';
      categories.forEach(cat => {
        select.innerHTML += `<option value="${cat}">${cat}</option>`;
      });
    }

    function applyFilter() {
      const category = document.getElementById('categoryFilter').value;
      const onlyNew = document.getElementById('newUpFilter').checked;

      rankData = originalData.filter(item => {
        if (category && item.category !== category) return false;
        if (onlyNew && item.isNew !== 1) return false;
        return true;
      });

      renderRankList();
    }

    function renderRankList() {
      const rankList = document.getElementById("rankList");

      if (rankData.length === 0) {
        rankList.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }

      let html = "";

      rankData.forEach((item, index) => {
        const rank = index + 1;
        const topClass = rank === 1 ? "top1" : rank === 2 ? "top2" : rank === 3 ? "top3" : "";
        const avatar = item.avatar ? item.avatar.trim().replace(/`/g, '') : "";
        const newTag = item.isNew === 1 ? '<span style="color:#ff6b6b;font-size:0.75rem;margin-left:5px;">[新]</span>' : '';
        
        html += `
          <div class="rank-item ${topClass}">
            <div class="rank-number">${rank}</div>
            <img class="rank-avatar" src="${avatar}" alt="${item.nickname || ""}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect fill=%22%23ddd%22 width=%22100%22 height=%22100%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 font-size=%2250%22%3E👤%3C/text%3E%3C/svg%3E'">
            <div class="rank-info">
              <div class="rank-name">${item.nickname || "未知用户"}${newTag}</div>
              <div class="rank-meta">
                <span>粉丝: ${item.fans || "0"}</span>
                <span>分区: ${item.partition || "-"}</span>
                <span>mid: ${item.mid || "-"}</span>
              </div>
            </div>
            <div class="rank-score">
              <div class="score-value">${item.rankTime || "-"}</div>
              <div class="score-label">上榜次数</div>
            </div>
          </div>
        `;
      });

      rankList.innerHTML = html;
    }

    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function scrollToBottom() {
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    function exportToExcel() {
      if (rankData.length === 0) {
        alert('暂无数据可导出');
        return;
      }

      const headers = ['排名', '昵称', '粉丝数', '分区', 'MID', '主营类目', '上榜次数', '是否新上榜'];
      const rows = rankData.map((item, index) => [
        index + 1,
        item.nickname || '未知用户',
        item.fans || '0',
        item.partition || '-',
        item.mid || '-',
        item.category || '-',
        item.rankTime || '0',
        item.isNew === 1 ? '是' : '否'
      ]);

      let csvContent = '\uFEFF' + headers.join(',') + '\n';
      rows.forEach(row => {
        csvContent += row.map(cell => {
          const cellStr = String(cell);
          if (cellStr.includes(',') || cellStr.includes('"') || cellStr.includes('\n')) {
            return '"' + cellStr.replace(/"/g, '""') + '"';
          }
          return cellStr;
        }).join(',') + '\n';
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      const url = URL.createObjectURL(blob);
      link.setAttribute('href', url);
      link.setAttribute('download', `B站UP主排行榜_${new Date().toLocaleDateString('zh-CN')}.csv`);
      link.style.visibility = 'hidden';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    loadRankList();
  </script>
</body>
</html>
